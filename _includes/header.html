<header class="post-header">
  <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
  {% if page.search %}
  <div class="articles-heading">
    <h1 class="post-title baseline-fix" itemprop="name headline">{{ page.title | escape | replace: "​", "<wbr>" }}</h1>
    <form class="article-search" role="search" aria-label="게시글 검색">
      <label for="article-search-input">검색</label>
      <input id="article-search-input" type="search" placeholder="게시글 검색" autocomplete="off" aria-controls="article-list" aria-describedby="article-search-status">
    </form>
  </div>
  {% else %}
  <h1 class="post-title baseline-fix" itemprop="name headline">{{ page.title | escape | replace: "​", "<wbr>" }}</h1>
  {% endif %}
</header>

{% if page.cover_url %}
<div class="post-cover" aria-label="Cover">
  <div class="post-cover-wrapper">
    <img src="{{ page.cover_url }}" alt="" />
  </div>
  <div class="cover-meta">{{ page.cover_meta | markdownify }}</div>
</div>
{% endif %}

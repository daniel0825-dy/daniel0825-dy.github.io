<nav class="taxonomy-nav" aria-label="분류 및 태그 탐색">
  <div class="taxonomy-group"><span class="taxonomy-label">분류</span>
    {% for category in site.data.taxonomy.categories %}
    <a href="{{ category | url_encode | prepend: '/categories/' | append: '/' | relative_url }}"{% if page.title == category %} aria-current="page"{% endif %}>{{ category | escape }}</a>
    {% endfor %}
  </div>
  <div class="taxonomy-group"><span class="taxonomy-label">태그</span>
    {% for tag in site.data.taxonomy.tags %}
    <a href="{{ tag | url_encode | prepend: '/tags/' | append: '/' | relative_url }}"{% if page.title == tag %} aria-current="page"{% endif %}>{{ tag | escape }}</a>
    {% endfor %}
  </div>
</nav>
